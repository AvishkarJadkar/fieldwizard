# BoT-SORT for wide-angle, panning football footage.
# ByteTrack alone collapses when the camera pans: every box shifts together and
# IoU association fails, re-spawning the whole squad with new IDs. BoT-SORT's
# global motion compensation (GMC) warps tracks with the camera before matching.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 60
match_thresh: 0.9
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
